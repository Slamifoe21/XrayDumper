name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""

          - goos: linux
            goarch: arm64
            ext: ""

          - goos: windows
            goarch: amd64
            ext: ".exe"

          - goos: windows
            goarch: arm64
            ext: ".exe"

          - goos: darwin
            goarch: amd64
            ext: ""

          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p output

          COMMIT=$(git rev-parse --short HEAD)

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION#v} -X main.commit=${COMMIT}" \
            -o "output/xd-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: output/


  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum xd-* > checksums.txt

      - name: Verify release files
        working-directory: artifacts
        run: |
          echo "=== Release files ==="
          ls -lah

          echo
          echo "=== Checksums ==="
          cat checksums.txt

          echo
          echo "=== Verification ==="

          test -s checksums.txt

          for file in xd-*; do
            test -f "$file"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/xd-linux-amd64
            artifacts/xd-linux-arm64
            artifacts/xd-windows-amd64.exe
            artifacts/xd-windows-arm64.exe
            artifacts/xd-darwin-amd64
            artifacts/xd-darwin-arm64
            artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
