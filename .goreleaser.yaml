version: 2

project_name: xd

before:
  hooks:
    - go mod download

builds:
  - id: xd
    main: .

    flags:
      - -trimpath

    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - xd

    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: false

  name_template: "{{ .Tag }}"

changelog:
  sort: asc